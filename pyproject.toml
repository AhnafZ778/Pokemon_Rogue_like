[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-roguelike"
version = "0.1.0"
description = "A terminal Pokémon roguelike powered by PokéAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "Pillow>=10,<13",
    "pygame-ce>=2.5,<3",
]

[project.scripts]
pokemon-roguelike = "pokemon_roguelike.gui:run"
pokemon-roguelike-terminal = "pokemon_roguelike.cli:run"

[tool.setuptools.packages.find]
include = ["pokemon_roguelike*"]
